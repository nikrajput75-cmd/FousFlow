<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060d1f">
<title>FocusFlow | Achievements</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="glass.css">
<script src="script.js" defer></script>
</head>
<body data-page="achievements"><div class="app-shell"><main class="main-content">
<header class="topbar"><div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong>Achievements</strong></div><time class="today-label" id="today-label"></time></header>
<section class="level"><div class="ring" id="ring"><span id="lvl">1</span></div><div><h1>Your progress</h1><p id="xp-text"></p><p>Each task earns 10 XP, each puzzle 5 XP, and each focus session of 5+ minutes 25 XP.</p></div></section>
<section class="stats" aria-label="Totals"><div class="stat tilt"><b id="a-streak">0</b><span>Day streak</span></div><div class="stat tilt"><b id="a-total">0</b><span>Tasks completed</span></div><div class="stat tilt"><b id="a-focus">0</b><span>Focus sessions</span></div><div class="stat tilt"><b id="a-xp">0</b><span>Total XP</span></div></section>
<section class="block"><h2>Daily quests</h2><div id="quests"></div></section>
<section class="block"><h2>Last 7 days</h2><div class="week" id="week" role="img" aria-label="Tasks completed per day over the last week"></div></section>
<section class="block"><h2>Badges</h2><div class="badges" id="badges"></div></section>
</main></div></body></html>
