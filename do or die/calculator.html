<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>FocusFlow | Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="fx.css">
<link rel="stylesheet" href="glass.css">
<script src="script.js" defer></script>
</head>
<body data-page="calc">
<div class="app-shell">
  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb">
        <span>Workspace</span>
        <span class="breadcrumb-slash">/</span>
        <strong>Calculator</strong>
      </div>
      <div class="calc-header-actions">
        <button id="toggle-angle-mode" class="calc-mode" type="button" title="Toggle degrees and radians">DEG</button>
        <time class="today-label" id="today-label"></time>
      </div>
    </header>

    <section class="calculator-layout" aria-label="Scientific calculator">
      <section class="calc-panel" aria-label="Calculator">
        <div class="calc-screen" aria-live="polite" aria-atomic="true">
          <div class="calc-screen-meta">
            <span id="mem-indicator" class="calc-memory" aria-label="Memory contains a value">M</span>
            <span id="angle-status">DEG</span>
          </div>
          <div class="calc-expression" id="expr"></div>
          <div class="calc-result" id="res">0</div>
        </div>
        <div class="calc-keys" id="keys" aria-label="Calculator keys"></div>
      </section>

      <section class="calc-history" aria-labelledby="history-title">
        <div class="calc-history-heading">
          <h2 id="history-title">History</h2>
          <button class="calc-clear-history" id="clear-hist" type="button">Clear</button>
        </div>
        <div class="calc-history-list" id="hist" aria-live="polite">
          <p class="empty-state">No calculations yet</p>
        </div>
      </section>
    </section>
  </main>
</div>
</body>
</html>
